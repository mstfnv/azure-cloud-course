name: Deploy Azure Infrastructure

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep template
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: rg-cloud-course
          template: ./main.bicep
          parameters: myIpAddress=88.80.101.158
          
      - name: Zip app code
        run: |
          cd app
          zip -r ../app.zip .
          cd ..

      - name: Deploy web app code
        run: az webapp deploy --resource-group rg-cloud-course --name webapp-cloud-course-2026 --src-path app.zip --type zip